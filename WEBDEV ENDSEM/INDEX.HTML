<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Interest Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <h2>Simple Interest</h2>
    <label for="principal">Principal (₹):</label>
    <input type="number" id="principal" placeholder="Enter principal">

    <label for="rate">Rate (%):</label>
    <input type="number" id="rate" placeholder="Enter rate">

    <label for="time">Time (years):</label>
    <input type="number" id="time" placeholder="Enter time">

    <button onclick="calculateInterest()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateInterest() {
      let principal = document.getElementById("principal").value;
      let rate = document.getElementById("rate").value;
      let time = document.getElementById("time").value;

      if(principal && rate && time) {
        let interest = (principal * rate * time) / 100;
        let total = parseFloat(principal) + interest;
        document.getElementById("result").innerHTML = 
          `Interest: ₹${interest.toFixed(2)} <br> Total Amount: ₹${total.toFixed(2)}`;
      } else {
        document.getElementById("result").innerHTML = "Please fill all fields!";
      }
    }
  </script>
</body>
</html>
